name: CI/CD Pipeline - Helpdesk IT

# 1. Cuándo se ejecuta el pipeline
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Permisos para publicar paquetes en GitHub Container Registry
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Nombre base del repositorio en minúsculas (ej: tu-usuario/project-tickets)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  
  # ETAPA 1: INTEGRACIÓN CONTINUA (Compilación y Pruebas)
 
  test-and-build:
    name: Validar y Compilar Código
    runs-on: ubuntu-latest

    steps:
      # Descarga el código del repositorio en la máquina virtual
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Configuración de Node.js
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---------------------------------------------------------------------
      # A) Verificación del Backend (helpdesk-core)
      # ---------------------------------------------------------------------
      - name: Instalar dependencias del Backend
        working-directory: ./helpdesk-core
        run: npm ci

      - name: Validar sintaxis del Backend
        working-directory: ./helpdesk-core
        run: |
          # Verifica que app.js no tenga errores de sintaxis
          node --check src/app.js
          echo "✓ Backend validado correctamente"

      # ---------------------------------------------------------------------
      # B) Verificación y Build del Frontend (helpdesk-frontend con Astro)
      # ---------------------------------------------------------------------
      - name: Instalar dependencias del Frontend
        working-directory: ./helpdesk-frontend
        run: npm install

      - name: Compilar Frontend con Astro (Build check)
        working-directory: ./helpdesk-frontend
        run: npm run build

 
  # ETAPA 2: ENTREGA CONTINUA (Docker Build & Push a GHCR)

  docker-publish:
    name: Construir y Publicar Imágenes Docker
    needs: test-and-build # Solo se ejecuta si la etapa anterior pasó con éxito
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Configurar Docker Buildx para builds optimizados y con caché
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Autenticación automática en GitHub Container Registry
      - name: Login en GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Convertir el nombre del repositorio a minúsculas (requerido por Docker)
      - name: Formatear nombre del repo a minúsculas
        id: string_transform
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # ---------------------------------------------------------------------
      # 1. Construir y Publicar Imagen del Backend
      # ---------------------------------------------------------------------
      - name: Build y Push del Backend
        uses: docker/build-push-action@v5
        with:
          context: ./helpdesk-core
          file: ./helpdesk-core/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-backend:latest
            ghcr.io/${{ env.REPO_LOWER }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------------
      # 2. Construir y Publicar Imagen del Frontend
      # ---------------------------------------------------------------------
      - name: Build y Push del Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./helpdesk-frontend
          file: ./helpdesk-frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-frontend:latest
            ghcr.io/${{ env.REPO_LOWER }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max